const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.salt), iterations:600000, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.ct));
  document.open(); document.write(new TextDecoder().decode(plain)); document.close();
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  try { await unlock(pw); try { localStorage.setItem("jd_pw", pw); } catch(_){} }
  catch(_) { document.getElementById("err").textContent = "Falsches Passwort"; }
});
(async () => { try { const s = localStorage.getItem("jd_pw"); if (s) await unlock(s); } catch(_){} })();
</script>
